<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#0b6b4f" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
    <!-- Static manifest link so crawlers / PWABuilder see it pre-hydration; the
         layout also injects the @vite-pwa/sveltekit-generated link at runtime. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chhath Puja" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Google Tag Manager (container GTM-N6BF7NP7). GA4 and Microsoft Clarity
         run as TAGS INSIDE this single container, so only ONE snippet is
         installed. Hardcoded id: app.html is a static template that cannot read
         Vite env. gtm.js loads from Google's CDN and is not bundled. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-N6BF7NP7');
    </script>
    <!-- End Google Tag Manager -->

    <!-- Default SEO / social preview (per-page <title>/<meta> override these). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chhath Puja Transparency Portal" />
    <!-- audit PR-42: og:title / og:description / og:image / og:url are emitted PER ROUTE by
         src/lib/components/Seo.svelte. They used to be hard-coded here, so every share of every
         page previewed as the home page, and there was no og:url at all. Two competing og:title
         tags is worse than one wrong one, so the duplicates are gone from here. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />

    <!-- No-flash language: set <html lang> before first paint. -->
    <script>
      (function () {
        try {
          var l = localStorage.getItem('cpm_public_lang') === 'hi' ? 'hi' : 'en';
          document.documentElement.setAttribute('lang', l);
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: non-render-blocking (print->all swap) so first paint is not
         blocked on the network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      />
    </noscript>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-N6BF7NP7"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
