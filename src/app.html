<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <!-- Icons: Google Search reads ICO/PNG favicons but not SVG, hence the .ico (sizes="32x32" makes
         Chrome prefer the SVG when both exist). apple-touch-icon is opaque: iOS paints transparency
         black. The web manifest link comes from +layout.svelte, not from here. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#0b6b4f" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chhath Puja" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Language = address (/hi/… is Hindi; src/lib/lang/url.ts). Before first paint: a Hindi address gets
         lang="hi" (the offline shell is one file for every address), and a visitor who chose Hindi on
         an earlier visit (localStorage) is taken from an English PAGE address to its /hi twin. Files are
         never redirected; crawlers have no storage. The flag stops the analytics snippet below from
         counting the page that is being left. Tested by src/lib/lang/app-html-script.test.ts. -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          if (p === '/hi' || p.indexOf('/hi/') === 0) {
            document.documentElement.setAttribute('lang', 'hi');
            return;
          }
          if (/\.[A-Za-z0-9]+$/.test(p) || p.indexOf('/.well-known/') === 0) return;
          if (localStorage.getItem('cpm_public_lang') === 'hi') {
            window.__cpmRedirecting = true;
            location.replace('/hi' + (p === '/' ? '' : p) + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Tag Manager (container GTM-N6BF7NP7). GA4 and Microsoft Clarity run as TAGS
         INSIDE this single container. It loads ONLY if the visitor has already accepted
         analytics cookies (localStorage 'cpm_analytics_consent' === 'granted'); first-time
         visitors get it after pressing Accept in the consent banner (src/lib/analytics/consent.ts).
         Hardcoded id: app.html is a static template that cannot read Vite env. -->
    <script>
      (function (w, d, s, l, i) {
        try {
          if (w.__cpmRedirecting) return;
          if (localStorage.getItem('cpm_analytics_consent') !== 'granted') return;
        } catch (e) {
          return;
        }
        w.__cpmGtmLoaded = true;
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-N6BF7NP7');
    </script>
    <!-- End Google Tag Manager -->

    <!-- Default SEO / social preview (per-page <title>/<meta> override these). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chhath Puja Transparency Portal" />
    <!-- audit PR-42: og:title / og:description / og:image / og:url are emitted PER ROUTE by
         src/lib/components/Seo.svelte. They used to be hard-coded here, so every share of every
         page previewed as the home page, and there was no og:url at all. Two competing og:title
         tags is worse than one wrong one, so the duplicates are gone from here. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />

    <!-- API lives on its own hostname: open DNS+TLS while the JS downloads (handshake only, no
         request reaches the Worker). Keep in sync with PUBLIC_API_BASE default in src/lib/config.ts. -->
    <link rel="preconnect" href="https://chhath-public-worker.shaharpura.com" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Fonts are self-hosted (@font-face in src/app.css, files in static/fonts), so no
         request goes to Google for them. -->

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
